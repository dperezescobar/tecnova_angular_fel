<div class="euro-login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo-circle">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <h1 class="brand-title">EUROSOCCER</h1>
      <p class="brand-subtitle">Control de Canchas & Gestión Deportiva</p>
    </div>

    @if (errorMessage()) {
      <div class="alert-box error">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (submit)="onLogin($event)" class="login-form">
      <div class="form-group">
        <label for="username"><i class="fa-solid fa-user"></i> Usuario</label>
        <input
          id="username"
          type="text"
          class="login-input"
          [(ngModel)]="usuario"
          name="usuario"
          placeholder="Ingrese su usuario"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label for="password"><i class="fa-solid fa-key"></i> Contraseña</label>
        <input
          id="password"
          type="password"
          class="login-input"
          [(ngModel)]="clave"
          name="clave"
          placeholder="Ingrese su contraseña"
          required
          autocomplete="current-password"
        />
      </div>

      <button type="submit" class="btn-login" [disabled]="loading()">
        @if (loading()) {
          <i class="fa-solid fa-arrows-rotate spin"></i> Validando Acceso...
        } @else {
          <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Sistema
        }
      </button>
    </form>

    <div class="login-footer">
      <span class="tenant-tag"><i class="fa-solid fa-shield-halved"></i> Sede: EuroSoccer Central</span>
      <p class="copyright">Tecnova Software Solutions • CONTASK</p>
    </div>
  </div>
</div>
